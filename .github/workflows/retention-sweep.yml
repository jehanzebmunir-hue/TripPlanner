name: Retention sweep

# Runs services/retention.service.ts daily: deletes anonymous trips
# untouched for 90+ days, and expired/already-used password-reset tokens.
# Needs a DATABASE_URL secret pointed at the real production database (the
# same Neon connection string as Render's backend service) — Settings ->
# Secrets and variables -> Actions -> New repository secret on GitHub.
# workflow_dispatch lets you trigger it manually to verify it's wired up
# correctly, without waiting for the schedule.

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run sweep:stale-trips
